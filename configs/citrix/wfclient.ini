;
;    wfclient.ini - Optimized for Native Experience (FORCED OVERRIDES)
;
[WFClient]
Version=2
KeyboardLayout=(User Profile)
KeyboardType=(Default)
KeyboardMappingFile=automatic.kbd
KeyboardDescription=Automatic (User Profile)
KeyboardEventMode=Scancode
KeyboardSyncMode=Once
TransparentKeyPassthrough=FullScreenOnly
CREnabled=True
AllowBidirectionalContentRedirection=True
BrowserProtocol=HTTPonTCP
BrowserTimeout=5000
CDMAllowed=On
ClientPrinterQueue=On
ClientManagement=On
ClientComm=On
MouseSendsControlV=False

; Hotkeys remapped to avoid collisions with GNOME
Hotkey12Shift=Ctrl+Shift
Hotkey11Shift=Ctrl+Shift
Hotkey10Shift=Ctrl+Shift
Hotkey9Shift=Ctrl+Shift
Hotkey8Shift=Ctrl+Shift
Hotkey7Shift=Ctrl+Shift
Hotkey6Shift=Ctrl+Shift
Hotkey5Shift=Ctrl+Shift
Hotkey4Shift=Ctrl+Shift
Hotkey3Shift=Ctrl+Shift
Hotkey2Shift=Ctrl+Shift
Hotkey1Shift=Ctrl+Shift

IgnoreErrors=9,15,32
AllowAudioInput=True
HDXH264InputEnabled=True
EnhancedResizingEnabled=True

; Native-like Experience Settings (FORCING OVERRIDES)
; These will try to override the .ica file if the client allows it
MultiMonitorPnPEnabled=True
MultiMonitorSelectionEnabled=True
SkipPnPDialog=True
HighDPIAware=True
DPIScaling=On
TWIMode=On
UseFullScreen=False
ScreenPercent=0
DesiredColor=24

TransportReconnectEnabled=On

[Graphics]
; Let the client decide resolution
; DesktopWidth=1920
; DesktopHeight=1200

[Thinwire3.0]
DesiredColor=24
PersistentCachePath=$HOME/.ICAClient/cache
PersistentCacheMinBitmap=2048
PersistentCacheEnabled=On
ApproximateColors=No
TWIOpenGLEnabled=True
OpenGLEnabled=True
H264Enabled=True
H265Enabled=True
DirectDecode=True
BatchDecode=False

[Browser]
H264FCSEnabled=True

[Client Engine\Application Launching]
SpeedScreenLatencyReduction=True
SpeedScreenLatencyReductionThreshold=10

[ICA 3.0]
MouseTimer=5
KeyboardTimer=5

[Network\Reconnection]
TCPRecvBufferSize=8388608
TCPSendBufferSize=8388608
ICAKeepAliveEnabled=True
ICAKeepAliveInterval=60

[Virtual Channels\Thinwire Graphics]
H264HWDecode=True

[Virtual Channels\Audio]
AudioLatencyControlEnabled=True
AudioMaxLatency=100
EnableUDPAudio=True

[Virtual Channels\Keyboard]
KeyPassthroughEscapeChar=F12
KeyPassthroughEscapeShift=Ctrl

[Virtual Channels\Teams]
; Teams Optimization
TeamsRedirection=1
