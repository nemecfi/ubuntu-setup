# ========================================
# ZAKLADNI NASTAVENI
# ========================================

# Mouse support
set -g mouse on
# 256 color terminal s true color podporou
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Clipboard integrace
set -g set-clipboard external
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# Prefix key - Ctrl+A (misto vychoziho Ctrl+B)
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# Vetsi scroll history
set-option -g history-limit 10000

# Windows a panes zacinaji od 1 (misto 0)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Rychlejsi ESC (dulezite pro Vim/Neovim)
set -sg escape-time 0

# ========================================
# KEYBINDINGS
# ========================================

# Pohyb mezi panes - ALT + Arrow keys
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Synchronize panes - Prefix + e (pise do vsech panes najednou)
bind e setw synchronize-panes

# Reload configu - Prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split windows - Prefix + | (vertical) nebo - (horizontal)
# Zachova current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Create 4-pane grid - Prefix + g
bind g split-window -h -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}" \; select-pane -t 0 \; split-window -v -c "#{pane_current_path}" \; select-layout tiled

# Quick search - Prefix + /
# Pouziti:
#   1. Prefix + /           - otevre search
#   2. Napis hledany text   - napriklad "error"
#   3. Enter                - potvrd
#   4. n                    - dalsi vysledek (next)
#   5. N                    - predchozi vysledek (previous)
#   6. q nebo ESC           - exit copy mode
bind / copy-mode \; send-keys /

# ========================================
# BAREVNE SCHEMA
# ========================================

# Pane borders
# Aktivni pane ma cervenou (#CC0033), neaktivni sedou (#565f89)
set -g pane-border-style "fg=#565f89"
set -g pane-active-border-style "fg=#CC0033,bold"
set -g pane-border-status off

# Messages (kdyz zmacknes Prefix a pises prikaz)
set -g message-style "bg=#CC0033,fg=#FBFBFB,bold"
set -g message-command-style "bg=#CC0033,fg=#FBFBFB,bold"

# Copy mode (kdyz scrollujes a vybiras text)
set -g mode-style "bg=#339999,fg=#121212"

# ========================================
# STATUS BAR
# ========================================

set -g status on
set -g status-interval 2              # Refresh kazde 2 sekundy
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#121212,fg=#FBFBFB"

# Leva strana - Session name (bile pozadi, cerny text)
set -g status-left-length 50
set -g status-left "#[fg=#121212,bg=#FBFBFB,bold] 󰣇 #S #[fg=#FBFBFB,bg=#121212]"

# Prava strana - Indicators + Load average + Cas + Datum
set -g status-right-length 200
set -g status-right "#{?client_prefix,#[fg=#FBFBFB]#[bg=#CC0033]#[bold] PREFIX #[fg=#CC0033]#[bg=#121212] ,}#{?pane_synchronized,#[fg=#FBFBFB]#[bg=#EF6D0A]#[bold] SYNC #[fg=#EF6D0A]#[bg=#121212] ,}#{?window_zoomed_flag,#[fg=#121212]#[bg=#FBFBFB]#[bold] ⊕ ZOOM #[fg=#FBFBFB]#[bg=#121212] ,}#[fg=#FBFBFB,bg=#980023,bold] ⚡ #(cat /proc/loadavg | cut -d' ' -f1-3) #[fg=#980023]#[bg=#121212]#[fg=#121212,bg=#FBFBFB,bold] ◷ %H:%M #[fg=#FBFBFB,bg=#121212]#[fg=#121212,bg=#FBFBFB,bold] %d.%m.%Y "

# Window status v status baru
set -g window-status-separator ""
set -g window-status-format "#[fg=#B2B2B2,bg=#121212] #I:#W "                    # Neaktivni windows - sede
set -g window-status-current-format "#[fg=#FBFBFB,bg=#CC0033,bold] #I:#W #[fg=#CC0033,bg=#121212]"  # Aktivni window - cervene

# Activity monitoring (kdyz se neco deje v jinem okne)
set -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style "fg=#EF6D0A,bg=#121212,bold"  # Oranzova

# Bell vypnuty
set -g visual-bell off
set -g bell-action none

# ========================================
# COPY MODE & VIM INTEGRATION
# ========================================

# Vi mode klavesy v copy mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection              # v = zacit vyber
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"  # y = zkopirovat

# ========================================
# MISC
# ========================================

# Automaticky pojmenuje okno podle beziciho programu
set-window-option -g automatic-rename on
set-option -g set-titles on

# Pane numbers (Prefix + q) - zobrazi dele
set -g display-panes-time 2000
set -g display-panes-active-colour "#339999"  # Teal pro aktivni
set -g display-panes-colour "#B2B2B2"         # Seda pro neaktivni

# Clock mode (Prefix + t) - 24h format, teal barva
set -g clock-mode-colour "#339999"
set -g clock-mode-style 24

# ========================================
# POUZITE BARVY (reference)
# ========================================
# #CC0033 - Primary Red (PREFIX, aktivni window, aktivni border)
# #980023 - Dark Red (Load average)
# #EF6D0A - Orange (SYNC, activity alert)
# #FBFBFB - White (text, nektere boxy)
# #121212 - Black (pozadi)
# #565f89 - Medium Grey (neaktivni borders)
# #B2B2B2 - Light Grey (neaktivni windows)
# #339999 - Teal (copy mode, clock, pane numbers)
